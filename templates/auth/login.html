{% extends 'base.html' %}

{% block title %}Login — ResultIQ{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your ResultIQ account</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="login_id" class="form-label">Email or Username</label>
        <input type="text" id="login_id" name="login_id" class="form-input"
               required autofocus autocomplete="username" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-input"
                 required autocomplete="current-password" placeholder="••••••••" style="padding-right: 40px;">
          <button type="button" class="btn-clear" onclick="togglePassword('password', 'eye-icon-login')" 
                  style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);" title="Toggle Password Visibility">
            <span id="eye-icon-login">👁️</span>
          </button>
        </div>
      </div>

      <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;margin:0.25rem 0 0.75rem 0;">
        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;cursor:pointer;color:var(--text-muted,#64748B);margin-bottom:0;font-weight:400;">
          <input type="checkbox" id="remember" name="remember" checked style="width:16px;height:16px;accent-color:var(--color-primary);cursor:pointer;">
          Remember me on this device
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.25rem;">
        Sign In →
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}">Register here</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🔒';
    } else {
        input.type = 'password';
        icon.textContent = '👁️';
    }
}
</script>
{% endblock %}
